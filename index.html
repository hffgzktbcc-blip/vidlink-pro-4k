<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#E50914" />
    <title>Lumia 4K — Ultra HD Cinema & Series Platform</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumia 4K" />
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=192&auto=format&fit=crop&q=80" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#07080d] text-white min-h-screen selection:bg-indigo-600 selection:text-white font-sans antialiased overflow-x-hidden">
    <!-- Ad & Popup Killer Guard (Zero Sandbox - 100% Cloudflare Compatible) -->
    <script>
      (function() {
        // Intercept top-level window.open calls from parent or cross-frame scripts
        const originalOpen = window.open;
        window.open = function(url, target, features) {
          if (url && typeof url === 'string') {
            const origin = window.location.origin;
            if (
              url.startsWith(origin) ||
              url.startsWith('/') ||
              url.startsWith('intent:') ||
              url.startsWith('vlc:') ||
              url.startsWith('blob:') ||
              url.includes('vidlink.pro') ||
              url.includes('youtube.com') ||
              url.includes('youtu.be')
            ) {
              return originalOpen.apply(this, arguments);
            }
          }
          console.warn('🛡️ Lumia Shield: Blocked unwanted popup/redirect to:', url);
          return null;
        };

        // Suppress unauthorized top-level page hijack redirects while watching
        window.addEventListener('beforeunload', function(e) {
          if (document.querySelector('[data-tv-modal="true"]')) {
            e.preventDefault();
            e.returnValue = '';
            return '';
          }
        }, true);

        // Window blur focus trap: immediately refocus Lumia 4K if a popup attempts to steal focus
        window.addEventListener('blur', function() {
          if (document.querySelector('[data-tv-modal="true"]')) {
            window.focus();
            setTimeout(function() {
              window.focus();
            }, 50);
          }
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
