<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#E50914" />
    <title>VidLink Pro 4K — Ultra HD Cinema & Series Platform</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VidLink 4K" />
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=192&auto=format&fit=crop&q=80" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#07080d] text-white min-h-screen selection:bg-indigo-600 selection:text-white font-sans antialiased overflow-x-hidden">
    <!-- Ad & Popup Killer Guard -->
    <script>
      (function() {
        // Intercept window.open from iframe ads
        const originalOpen = window.open;
        window.open = function(url, target, features) {
          // Allow internal app navigation, block foreign ad networks
          if (url && typeof url === 'string') {
            if (url.includes('vidlink-pro-4k.vercel.app') || url.startsWith('/') || url.startsWith('intent:')) {
              return originalOpen.apply(this, arguments);
            }
          }
          console.warn('🛡️ VidLink Shield: Blocked unwanted popup/redirect to:', url);
          return null;
        };

        // Suppress beforeunload and external ad redirects
        window.addEventListener('beforeunload', function(e) {
          // If in fullscreen or watching, stop ad page navigation hijack
          if (document.querySelector('[data-tv-modal="true"]')) {
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
