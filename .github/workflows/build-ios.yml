name: Build iOS Release Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*ios*'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package Capacitor iOS
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          bun install
          bun add @capacitor/ios

      - name: Build Web Application
        run: bun run build

      - name: Add & Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            bunx cap add ios
          fi
          bunx cap sync ios

      - name: Package iOS Project Source & Xcode Workspace
        run: |
          mkdir -p release-assets
          zip -r release-assets/VidLink-4K-Pro-iOS-Source.zip ios/
          ls -lh release-assets/

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidLink-4K-Pro-iOS
          path: release-assets/*
          retention-days: 30

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          files: |
            release-assets/VidLink-4K-Pro-iOS-Source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
