name: CI Quality Gate & Smoke Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Typecheck, Lint, Test & Vercel Preview Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Linter (OxLint)
        run: bun run lint || true

      - name: Type Check & Production Web Build
        run: bun run build

      - name: Validate Trending Cache Schema
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("public/data/trending-cache.json", "utf8"));
            if (!Array.isArray(data.trendingMovies) || !Array.isArray(data.trendingTV)) {
              console.error("❌ Invalid trending cache schema");
              process.exit(1);
            }
            console.log(`✅ Trending Cache Validated: ${data.trendingMovies.length} movies, ${data.trendingTV.length} TV shows.`);
          '

      - name: Verify Capacitor Android Sync
        run: bunx cap sync android
