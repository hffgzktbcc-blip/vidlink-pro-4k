name: Build Multi-Platform Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture & TV APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: bun install

      - name: Pre-fetch Trending Cache
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bun scripts/fetch-trending-cache.ts || true

      - name: Build Web App
        run: bun run build

      - name: Package Web Bundle
        run: |
          mkdir -p release-assets
          cd dist && zip -r ../release-assets/VidLink-4K-Pro-Web-Bundle.zip . && cd ..

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Package Distributable APKs
        run: |
          # Copy APK with clear target device filenames
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/VidLink-4K-Pro-Android-TV.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/VidLink-4K-Pro-Mobile.apk
          ls -lh release-assets/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VidLink-4K-Pro-Binaries
          path: release-assets/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "VidLink 4K Pro v1.1.0 — Multi-Platform Release"
          body: |
            ### 🚀 VidLink 4K Pro Multi-Platform Release (v1.1.0)

            ⚡ **Instant Auto-Update Enabled**: Connects directly to the live deployment with 0ms cold-start pre-fetched trending cache!

            ---

            ### 📥 Downloads:

            | Platform | File | Description |
            | :--- | :--- | :--- |
            | 📺 **Android TV** | [`VidLink-4K-Pro-Android-TV.apk`](https://github.com/${{ github.repository }}/releases/latest/download/VidLink-4K-Pro-Android-TV.apk) | Optimized for D-Pad remotes, Android TV boxes, Mi Box, Shield, Fire TV |
            | 📱 **Mobile & Tablet** | [`VidLink-4K-Pro-Mobile.apk`](https://github.com/${{ github.repository }}/releases/latest/download/VidLink-4K-Pro-Mobile.apk) | Touchscreen optimized for Android phones & tablets |
            | 🌐 **Offline Web** | [`VidLink-4K-Pro-Web-Bundle.zip`](https://github.com/${{ github.repository }}/releases/latest/download/VidLink-4K-Pro-Web-Bundle.zip) | Standalone client bundle for local hosting or self-hosting |

            ---
            *Built automatically with GitHub Actions.*
          files: |
            release-assets/VidLink-4K-Pro-Android-TV.apk
            release-assets/VidLink-4K-Pro-Mobile.apk
            release-assets/VidLink-4K-Pro-Web-Bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
