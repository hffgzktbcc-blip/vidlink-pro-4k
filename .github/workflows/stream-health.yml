name: Stream Health Monitor & Self-Healing Mirrors

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    name: Test Stream Mirrors & Commit Health Leaderboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Stream Health Benchmarks
        run: bun scripts/check-stream-health.ts

      - name: Commit Updated Stream Health Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stream-health.json
          if git diff --staged --quiet; then
            echo "Stream health is unchanged."
          else
            git commit -m "chore(health): update stream mirror health report [skip ci]"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
